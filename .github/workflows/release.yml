name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: make

      - name: Verify build
        run: |
          file build/MemoDismiss.app/Contents/MacOS/MemoDismiss
          test -f build/MemoDismiss.app/Contents/Info.plist

      - name: Package
        run: |
          cd build
          zip -r MemoDismiss.app.zip MemoDismiss.app

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/MemoDismiss.app.zip
          generate_release_notes: true
